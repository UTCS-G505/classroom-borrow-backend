services:
  db:
    image: mysql:8.0
    container_name: classroom-db
    restart: unless-stopped
    ports:
      - "3307:3306"           # 主機 3307 -> MySQL 3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql                 # 資料庫實際資料
      - ./sql:/docker-entrypoint-initdb.d          # 這裡放 classroom_borrow_system.sql

  backend:
    build: .
    container_name: classroom-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db               # 用 service 名稱，不是 localhost
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_PORT: 3306
